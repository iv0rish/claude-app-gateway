replicaCount: 2

namespace:
  create: true
  name: llm-gateway

image:
  repository: "123456789012.dkr.ecr.us-east-1.amazonaws.com/llm-gateway"
  tag: "0.1.0"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: "llm-gateway"

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 8080
  annotations: {}

ingress:
  enabled: false
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
  hosts:
    - host: llm-gateway.internal.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

extraEnv: []
extraEnvFrom: []
extraVolumes: []
extraVolumeMounts: []

config:
  appConfigPath: /etc/llm-gateway/gateway.yaml
  appsCompatEnabled: true
  publicUrl: https://llm-gateway.internal.example.com
  trustedProxies:
    - 10.0.0.0/8
  upstreamBaseUrl: http://vllm.vllm.svc.cluster.local:8000
  redisUrl: ""
  logLevel: info
  metricsEnabled: true
  rateLimitWindowMs: 60000
  rateLimitGlobalRpm: 600
  rateLimitTierRpm: {}
  rateLimitModelRpm: {}
  rateLimitGlobalTpm: 0
  rateLimitTierTpm: {}
  rateLimitModelTpm: {}
  promptLoggingEnabled: true
  guardrailInputEnabled: true
  guardrailOutputEnabled: true
  guardrailFailPolicy: closed
  bedrockRegion: us-east-1
  bedrockGuardrailId: replace-me
  bedrockGuardrailVersion: DRAFT
  refusalText: "This response was blocked by the organization's safety policy."
  oidc:
    issuer: https://login.example.com
    clientId: llm-gateway
    redirectUri: https://llm-gateway.internal.example.com/oauth/callback
    scopes:
      - openid
      - email
      - profile
    groupClaim: groups
    emailClaim: email
  session:
    issuer: llm-gateway
    audience: claude-code
    accessTokenTtlSeconds: 3600
    refreshTokenTtlSeconds: 2592000
  managedPolicies:
    - name: default
      groups: []
      emails: []
      settings:
        cli:
          availableModels:
            - claude-sonnet-4-6
          enforceAvailableModels: true
          permissions:
            deny:
              - "WebFetch"
          env:
            DISABLE_UPDATES: "1"
      availableModels:
        - claude-sonnet-4-6
      rateLimitTier: standard
  spendLimits:
    failPolicy: closed
    limits:
      - id: org-monthly
        scope: organization
        period: month
        amountUsd: 1000
  models:
    - id: claude-sonnet-4-6
      displayName: Internal vLLM Sonnet
      upstream: vllm-standard
      upstreamModel: my-model
      inputUsdPer1mTokens: 3
      outputUsdPer1mTokens: 15
  upstreams:
    anthropicCompatible:
      - name: vllm-standard
        type: anthropic
        baseUrl: http://vllm.vllm.svc.cluster.local:8000
        apiKeyEnv: VLLM_STANDARD_KEY
    bedrockNative:
      enabled: false
      name: bedrock-claude
      type: bedrock
      region: us-east-1
      modelId: anthropic.claude-3-5-sonnet-20241022-v2:0

secrets:
  create: true
  name: ""
  gatewayApiKeys:
    - key: replace-me
      tier: standard
  upstreamApiKey: ""
  oidcClientSecret: "replace-me"
  sessionJwtSecret: "replace-me"
  adminToken: "replace-me"
  postgresUrl: "postgres://user:password@postgres.example.com:5432/llm_gateway?sslmode=require"
  vllmStandardKey: "replace-me"
  stringData: {}

networkPolicy:
  enabled: true
  ingress:
    from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: llm-gateway
        podSelector:
          matchLabels:
            app.kubernetes.io/name: claude-apps-gateway
    ports:
      - port: 8080
        protocol: TCP
  egress:
    dns:
      enabled: true
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    extra: []
