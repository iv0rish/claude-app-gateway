replicaCount: 2

namespace:
  create: true
  name: llm-gateway

image:
  repository: "123456789012.dkr.ecr.us-east-1.amazonaws.com/llm-gateway"
  tag: "0.1.0"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: "llm-gateway"

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

extraEnv: []
extraEnvFrom: []

config:
  upstreamBaseUrl: http://vllm.vllm.svc.cluster.local:8000
  redisUrl: ""
  logLevel: info
  metricsEnabled: true
  rateLimitWindowMs: 60000
  rateLimitGlobalRpm: 600
  rateLimitTierRpm: {}
  rateLimitModelRpm: {}
  guardrailInputEnabled: true
  guardrailOutputEnabled: true
  guardrailFailPolicy: closed
  bedrockRegion: us-east-1
  bedrockGuardrailId: replace-me
  bedrockGuardrailVersion: DRAFT
  refusalText: "This response was blocked by the organization's safety policy."

secrets:
  create: true
  name: ""
  gatewayApiKeys:
    - key: replace-me
      tier: standard
  upstreamApiKey: ""

networkPolicy:
  enabled: true
  ingress:
    from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: llm-gateway
        podSelector:
          matchLabels:
            app.kubernetes.io/name: claude-apps-gateway
    ports:
      - port: 8080
        protocol: TCP
  egress:
    dns:
      enabled: true
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    extra: []
