{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "llm-gateway.secretName" . }}
  namespace: {{ include "llm-gateway.namespace" . }}
  labels:
    {{- include "llm-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  GATEWAY_API_KEYS: {{ toJson .Values.secrets.gatewayApiKeys | quote }}
  {{- with .Values.secrets.upstreamApiKey }}
  UPSTREAM_API_KEY: {{ . | quote }}
  {{- end }}
{{- end }}

