{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "llm-gateway.secretName" . }}
  namespace: {{ include "llm-gateway.namespace" . }}
  labels:
    {{- include "llm-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  GATEWAY_API_KEYS: {{ toJson .Values.secrets.gatewayApiKeys | quote }}
  {{- with .Values.secrets.upstreamApiKey }}
  UPSTREAM_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.oidcClientSecret }}
  OIDC_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.sessionJwtSecret }}
  SESSION_JWT_SECRET: {{ . | quote }}
  GATEWAY_JWT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.adminToken }}
  ADMIN_TOKEN: {{ . | quote }}
  ADMIN_TOKENS: {{ . | quote }}
  GATEWAY_ADMIN_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.postgresUrl }}
  POSTGRES_URL: {{ . | quote }}
  GATEWAY_POSTGRES_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.vllmStandardKey }}
  VLLM_STANDARD_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.stringData }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
