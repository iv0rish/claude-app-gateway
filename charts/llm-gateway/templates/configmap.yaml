apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "llm-gateway.fullname" . }}-config
  namespace: {{ include "llm-gateway.namespace" . }}
  labels:
    {{- include "llm-gateway.labels" . | nindent 4 }}
data:
  {{- with .Values.config.appConfigPath }}
  APP_CONFIG_PATH: {{ . | quote }}
  {{- end }}
  HOST: "0.0.0.0"
  PORT: {{ .Values.service.port | quote }}
  UPSTREAM_BASE_URL: {{ .Values.config.upstreamBaseUrl | quote }}
  {{- with .Values.config.redisUrl }}
  REDIS_URL: {{ . | quote }}
  {{- end }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  METRICS_ENABLED: {{ .Values.config.metricsEnabled | quote }}
  RATE_LIMIT_WINDOW_MS: {{ .Values.config.rateLimitWindowMs | quote }}
  RATE_LIMIT_GLOBAL_RPM: {{ .Values.config.rateLimitGlobalRpm | quote }}
  RATE_LIMIT_TIER_RPM: {{ toJson .Values.config.rateLimitTierRpm | quote }}
  RATE_LIMIT_MODEL_RPM: {{ toJson .Values.config.rateLimitModelRpm | quote }}
  RATE_LIMIT_GLOBAL_TPM: {{ .Values.config.rateLimitGlobalTpm | quote }}
  RATE_LIMIT_TIER_TPM: {{ toJson .Values.config.rateLimitTierTpm | quote }}
  RATE_LIMIT_MODEL_TPM: {{ toJson .Values.config.rateLimitModelTpm | quote }}
  PROMPT_LOGGING_ENABLED: {{ .Values.config.promptLoggingEnabled | quote }}
  GUARDRAIL_INPUT_ENABLED: {{ .Values.config.guardrailInputEnabled | quote }}
  GUARDRAIL_OUTPUT_ENABLED: {{ .Values.config.guardrailOutputEnabled | quote }}
  GUARDRAIL_FAIL_POLICY: {{ .Values.config.guardrailFailPolicy | quote }}
  {{- with .Values.config.bedrockRegion }}
  BEDROCK_REGION: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.bedrockGuardrailId }}
  BEDROCK_GUARDRAIL_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.bedrockGuardrailVersion }}
  BEDROCK_GUARDRAIL_VERSION: {{ . | quote }}
  {{- end }}
  REFUSAL_TEXT: {{ .Values.config.refusalText | quote }}
  APPS_COMPAT_ENABLED: {{ .Values.config.appsCompatEnabled | quote }}
  APPS_EXTERNAL_URL: {{ .Values.config.publicUrl | quote }}
  OIDC_ISSUER: {{ .Values.config.oidc.issuer | quote }}
  OIDC_CLIENT_ID: {{ .Values.config.oidc.clientId | quote }}
  OIDC_REDIRECT_URI: {{ .Values.config.oidc.redirectUri | quote }}
  OIDC_SCOPES: {{ toJson .Values.config.oidc.scopes | quote }}
  OIDC_GROUP_CLAIM: {{ .Values.config.oidc.groupClaim | quote }}
  OIDC_EMAIL_CLAIM: {{ .Values.config.oidc.emailClaim | quote }}
  SESSION_ISSUER: {{ .Values.config.session.issuer | quote }}
  SESSION_AUDIENCE: {{ .Values.config.session.audience | quote }}
  SESSION_ACCESS_TOKEN_TTL_SECONDS: {{ .Values.config.session.accessTokenTtlSeconds | int | quote }}
  SESSION_REFRESH_TOKEN_TTL_SECONDS: {{ .Values.config.session.refreshTokenTtlSeconds | int | quote }}
  MANAGED_POLICIES: {{ toJson .Values.config.managedPolicies | quote }}
  SPEND_LIMITS: {{ toJson .Values.config.spendLimits.limits | quote }}
  gateway.yaml: |
    enabled: {{ .Values.config.appsCompatEnabled }}
    externalUrl: {{ .Values.config.publicUrl | quote }}
    oidc:
      issuer: {{ .Values.config.oidc.issuer | quote }}
      clientId: {{ .Values.config.oidc.clientId | quote }}
      clientSecret: ${OIDC_CLIENT_SECRET}
      redirectUri: {{ .Values.config.oidc.redirectUri | quote }}
      scopes:
        {{- toYaml .Values.config.oidc.scopes | nindent 8 }}
      groupClaim: {{ .Values.config.oidc.groupClaim | quote }}
      emailClaim: {{ .Values.config.oidc.emailClaim | quote }}

    session:
      issuer: {{ .Values.config.session.issuer | quote }}
      audience: {{ .Values.config.session.audience | quote }}
      jwtSecret: ${SESSION_JWT_SECRET}
      accessTokenTtlSeconds: {{ .Values.config.session.accessTokenTtlSeconds | int }}
      refreshTokenTtlSeconds: {{ .Values.config.session.refreshTokenTtlSeconds | int }}

    store:
      postgresUrl: ${POSTGRES_URL}

    admin:
      tokens:
        - ${ADMIN_TOKEN}

    upstreams:
      {{- range .Values.config.upstreams.anthropicCompatible }}
      - name: {{ .name | quote }}
        type: {{ .type | quote }}
        baseUrl: {{ .baseUrl | quote }}
        apiKey: {{ printf "${%s}" .apiKeyEnv | quote }}
      {{- end }}
      {{- if .Values.config.upstreams.bedrockNative.enabled }}
      - name: {{ .Values.config.upstreams.bedrockNative.name | quote }}
        type: {{ .Values.config.upstreams.bedrockNative.type | quote }}
        region: {{ .Values.config.upstreams.bedrockNative.region | quote }}
        modelMap:
          default: {{ .Values.config.upstreams.bedrockNative.modelId | quote }}
      {{- end }}

    models:
      {{- range .Values.config.models }}
      - id: {{ .id | quote }}
        displayName: {{ .displayName | quote }}
        upstream: {{ .upstream | quote }}
        upstreamModel: {{ .upstreamModel | quote }}
        inputUsdPer1mTokens: {{ .inputUsdPer1mTokens }}
        outputUsdPer1mTokens: {{ .outputUsdPer1mTokens }}
      {{- end }}

    managedPolicies:
      {{- toYaml .Values.config.managedPolicies | nindent 6 }}

    spendLimits:
      failPolicy: {{ .Values.config.spendLimits.failPolicy | quote }}
      limits:
        {{- toYaml .Values.config.spendLimits.limits | nindent 8 }}
