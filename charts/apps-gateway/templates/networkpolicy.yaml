{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "claude-apps-gateway.fullname" . }}
  namespace: {{ include "claude-apps-gateway.namespace" . }}
  labels:
    {{- include "claude-apps-gateway.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "claude-apps-gateway.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingress.from | nindent 8 }}
      ports:
        {{- toYaml .Values.networkPolicy.ingress.ports | nindent 8 }}
  egress:
    {{- if .Values.networkPolicy.egress.dns.enabled }}
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.egress.dns.namespaceSelector | nindent 12 }}
      ports:
        {{- toYaml .Values.networkPolicy.egress.dns.ports | nindent 8 }}
    {{- end }}
    {{- if .Values.networkPolicy.egress.policyProxy.enabled }}
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.egress.policyProxy.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.egress.policyProxy.podSelector | nindent 12 }}
      ports:
        {{- toYaml .Values.networkPolicy.egress.policyProxy.ports | nindent 8 }}
    {{- end }}
    {{- if .Values.networkPolicy.egress.postgres.enabled }}
    - to:
        {{- range .Values.networkPolicy.egress.postgres.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - port: {{ .Values.networkPolicy.egress.postgres.port }}
          protocol: TCP
    {{- end }}
    {{- if .Values.networkPolicy.egress.oidc.enabled }}
    - to:
        {{- range .Values.networkPolicy.egress.oidc.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - port: {{ .Values.networkPolicy.egress.oidc.port }}
          protocol: TCP
    {{- end }}
    {{- if .Values.networkPolicy.egress.otlp.enabled }}
    - to:
        {{- range .Values.networkPolicy.egress.otlp.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - port: {{ .Values.networkPolicy.egress.otlp.port }}
          protocol: TCP
    {{- end }}
    {{- with .Values.networkPolicy.egress.extra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
