replicaCount: 2

namespace:
  create: true
  name: llm-gateway

image:
  repository: "123456789012.dkr.ecr.us-east-1.amazonaws.com/claude-apps-gateway"
  tag: "0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 8080
  annotations: {}

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
  hosts:
    - host: claude-gateway.internal.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 30
  periodSeconds: 20

nodeSelector: {}
tolerations: []
affinity: {}

extraEnv: []
extraEnvFrom: []
extraVolumes: []
extraVolumeMounts: []

secrets:
  create: true
  name: ""
  stringData:
    OIDC_CLIENT_SECRET: "replace-me"
    GATEWAY_JWT_SECRET: "replace-me"
    GATEWAY_POSTGRES_URL: "postgres://user:password@postgres.example.com:5432/claude_gateway?sslmode=require"
    VLLM_STANDARD_KEY: "replace-me"

gatewayConfig: |
  listen:
    host: 0.0.0.0
    port: 8080
    public_url: https://claude-gateway.internal.example.com
    trusted_proxies:
      - 10.0.0.0/8

  oidc:
    issuer: https://login.example.com
    client_id: 0oa1example2
    client_secret: ${OIDC_CLIENT_SECRET}
    allowed_email_domains:
      - example.com
    userinfo_fallback: true

  session:
    jwt_secret: ${GATEWAY_JWT_SECRET}
    ttl_hours: 1

  store:
    postgres_url: ${GATEWAY_POSTGRES_URL}
    max_connections: 5

  upstreams:
    - name: vllm-standard
      provider: anthropic
      auth:
        api_key: ${VLLM_STANDARD_KEY}
      base_url: http://llm-gateway.llm-gateway.svc.cluster.local:8080

  auto_include_builtin_models: false
  models:
    - id: claude-sonnet-4-6
      label: Internal vLLM Sonnet
      upstream_model:
        vllm-standard: my-model

  managed:
    policies:
      - match: {}
        cli:
          availableModels:
            - claude-sonnet-4-6
          enforceAvailableModels: true
          permissions:
            deny:
              - "WebFetch"
          env:
            DISABLE_UPDATES: "1"

networkPolicy:
  enabled: true
  ingress:
    from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: ingress-nginx
    ports:
      - port: 8080
        protocol: TCP
  egress:
    dns:
      enabled: true
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    llmGateway:
      enabled: true
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: llm-gateway
      podSelector:
        matchLabels:
          app.kubernetes.io/name: llm-gateway
      ports:
        - port: 8080
          protocol: TCP
    postgres:
      enabled: false
      cidrs: []
      port: 5432
    oidc:
      enabled: false
      cidrs: []
      port: 443
    otlp:
      enabled: false
      cidrs: []
      port: 4317
    extra: []
