apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mcp-gateway.fullname" . }}-config
  namespace: {{ include "mcp-gateway.namespace" . }}
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
data:
  PUBLIC_URL: {{ .Values.config.publicUrl | quote }}
  OIDC_ISSUER: {{ .Values.config.oidcIssuer | quote }}
  OIDC_AUDIENCE: {{ .Values.config.oidcAudience | quote }}
  {{- with .Values.config.oidcJwksUrl }}
  OIDC_JWKS_URL: {{ . | quote }}
  {{- end }}
  ALLOWED_EMAIL_DOMAINS: {{ join "," .Values.config.allowedEmailDomains | quote }}
  ALLOWED_GROUPS: {{ join "," .Values.config.allowedGroups | quote }}
  GROUPS_CLAIM: {{ .Values.config.groupsClaim | quote }}
  RATE_LIMIT_WINDOW_MS: {{ .Values.config.rateLimitWindowMs | quote }}
  RATE_LIMIT_MAX: {{ .Values.config.rateLimitMax | quote }}
  MCP_TOOL_POLICIES: {{ toJson .Values.config.toolPolicies | quote }}
  MCP_UPSTREAMS: {{ toJson .Values.config.upstreams | quote }}
