listen:
  host: 0.0.0.0
  port: 8080
  # Must match the external HTTPS origin used by the ALB/Ingress.
  public_url: https://claude-gateway.internal.example.com
  trusted_proxies:
    - 10.0.0.0/8

oidc:
  issuer: https://login.example.com
  client_id: 0oa1example2
  client_secret: ${OIDC_CLIENT_SECRET}
  allowed_email_domains:
    - example.com
  userinfo_fallback: true

session:
  jwt_secret: ${GATEWAY_JWT_SECRET}
  ttl_hours: 1

store:
  # Add ?sslmode=require for managed Postgres.
  postgres_url: ${GATEWAY_POSTGRES_URL}
  max_connections: 5

upstreams:
  - name: vllm-standard
    provider: anthropic
    auth:
      api_key: ${VLLM_STANDARD_KEY}
    base_url: http://llm-rate-limit-proxy.llm-gateway.svc.cluster.local:8080

auto_include_builtin_models: false
models:
  - id: claude-sonnet-4-6
    label: Internal vLLM Sonnet
    upstream_model:
      vllm-standard: my-model

managed:
  policies:
    - match: {}
      cli:
        availableModels:
          - claude-sonnet-4-6
        enforceAvailableModels: true
        permissions:
          deny:
            - WebFetch
        env:
          DISABLE_UPDATES: "1"
